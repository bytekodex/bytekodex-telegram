name: bot

# The bot ships whenever code that affects it lands on master. Nothing here touches the toolchain
# images — see toolchains.yml — so a Kotlin version landing does not force a rebuild of 60-odd
# images, and a bot rebuild does not wait on them. A new lock does ship through here: the bot reads
# it from its own image, and toolchains.yml starts this workflow after committing one.
on:
  push:
    branches: [master]
    paths:
      - "cmd/**"
      - "internal/**"
      - "Dockerfile.bot"
      - "go.mod"
      - "go.sum"
      - "toolchains/lock.json"
  workflow_dispatch: {}

# A deploy that started mid-push should finish before the next one starts, not race it.
concurrency:
  group: bot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the bot
        uses: actions/checkout@v5
        with:
          path: telegram

      # The render package is cgo over the platform's C ABI, so the image needs the platform's
      # source to build it from — built from source, same as ci.yml does, rather than downloaded,
      # so an ABI change breaks this build instead of production.
      - name: Check out the platform
        uses: actions/checkout@v5
        with:
          repository: bytekodex/bytekodex-platform
          ref: master
          path: platform

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: |
          docker build -f telegram/Dockerfile.bot \
            -t ghcr.io/bytekodex/bot:${{ github.sha }} \
            -t ghcr.io/bytekodex/bot:latest \
            .

      - name: Push
        run: |
          docker push ghcr.io/bytekodex/bot:${{ github.sha }}
          docker push ghcr.io/bytekodex/bot:latest

      # The server runs the bot as a Komodo stack. This is the same signed call GitHub's own push
      # webhook makes: Komodo pulls `latest`, readies the host with `toolchainctl sync`, and
      # restarts the bot.
      - name: Deploy
        env:
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          body='{"ref":"refs/heads/main"}'
          signature="$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" -r | cut -d' ' -f1)"
          curl -fsS -X POST https://komodo.mairwunnx.com/listener/github/stack/bytekodex/deploy \
            -H 'content-type: application/json' -H "x-hub-signature-256: sha256=$signature" -d "$body"
