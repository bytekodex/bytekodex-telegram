<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#0d0f14;font-family:-apple-system,"SF Pro Display","Inter",sans-serif}
#bg{position:absolute;left:0;top:0;width:1280px;height:640px;object-fit:cover;opacity:.55;filter:saturate(1.15)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,12,22,.96) 0%,rgba(13,12,22,.86) 36%,rgba(13,12,22,.35) 62%,rgba(13,12,22,.15) 100%)}
.glow{position:absolute;left:-120px;top:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(180,142,173,.28),rgba(180,142,173,0) 70%)}
.text{position:absolute;left:64px;top:0;bottom:0;width:540px;display:flex;flex-direction:column;justify-content:center;color:#fff}
.text h1,.text p{text-shadow:0 2px 18px rgba(0,0,0,.45)}
.tag{display:inline-flex;align-items:center;gap:12px;font-size:18px;font-weight:700;color:#8fd3a9;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
.tag i{font-style:normal;font-size:28px}
h1{margin:0;font-size:62px;line-height:1.02;font-weight:800;letter-spacing:-.02em}
h1 span{color:#c3a6ff}
p{margin:22px 0 0;font-size:22px;line-height:1.4;color:#d3d6df;max-width:520px}
p b{color:#fff;font-weight:600}
.chips{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px}
.chips b{font-weight:600;font-size:16px;color:#e6e8ee;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);padding:7px 12px;border-radius:8px}
.powered{margin-top:24px;display:flex;align-items:center;gap:8px;font-size:15px;color:rgba(255,255,255,.72)}
.powered strong{color:#fff;font-weight:600}
.made{position:absolute;left:64px;bottom:22px;font-size:12px;letter-spacing:.02em;color:rgba(255,255,255,.42)}
.shot{position:absolute;perspective:1600px}
.card{position:absolute;perspective:1600px}
.card img{width:100%;display:block;border-radius:12px;transform:rotateY(-12deg) rotateX(3deg) rotateZ(-1deg);box-shadow:0 30px 60px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.16)}
.shot img{width:100%;display:block;border-radius:14px;transform:rotateY(-16deg) rotateX(4deg) rotateZ(1deg);transform-origin:left center;box-shadow:0 40px 80px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.12)}
</style></head><body>
